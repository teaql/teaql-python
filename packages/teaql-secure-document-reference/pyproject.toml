[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teaql-secure-document-reference"
version = "0.3.1"
description = "Optional TeaQL secure document reference module"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "TeaQL" }]
dependencies = ["teaql==0.3.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["teaql_secure_document_reference*"]
