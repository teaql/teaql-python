[project]
name = "natural-message-service-lib"
version = "1.0.0"
description = "Generated python library"
dependencies = ["teaql==0.5.0.dev0", "aiosqlite>=0.22.1"]

[tool.setuptools]
py-modules = ["Q", "E", "runtime_module", "generated_search_models"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "requests*"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"