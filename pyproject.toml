[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teaql"
version = "0.1.1"
description = "TeaQL Runtime and Data Service for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "TeaQL" }]
keywords = ["teaql", "query", "database", "orm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "aiosqlite>=0.19.0",
    "aiomysql>=0.2.0",
    "asyncpg>=0.29.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://teaql.io"
Documentation = "https://teaql.io/docs"
Repository = "https://github.com/teaql/teaql-python"
Issues = "https://github.com/teaql/teaql-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teaql = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
